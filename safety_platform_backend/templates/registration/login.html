{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login · Safety & Accountability</title>
  <link rel="icon" type="image/png" href="{% static 'dashboard/img/logo.png' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #667EEA, #764BA2); min-height: 100vh; display: flex; align-items: center; }
    .login-card { max-width: 380px; margin: auto; border-radius: 20px; border: none; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
    .login-logo { display: block; width: 100%; max-width: 230px; height: auto; margin: 0 auto 8px; }
  </style>
</head>
<body>
  <div class="card login-card p-4">
    <div class="card-body">
      <img src="{% static 'dashboard/img/logo.png' %}" alt="Safety and Accountability" class="login-logo">
      <h4 class="fw-bold mb-1 text-center">Admin Login</h4>
      <p class="text-muted mb-4 text-center">Sign in to manage the platform</p>
      {% if form.errors %}
        <div class="alert alert-danger py-2">Incorrect email or password, or this account can't access the dashboard.</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100" style="background:#667EEA; border:none;">Log in</button>
      </form>
    </div>
  </div>
</body>
</html>
